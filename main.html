    <script>
        // ===========================
        // Emoji Steganography Engine
        // Using Unicode Variation Selectors (VS1–VS256)
        // ===========================

        const VARIATION_SELECTOR_START = 0xFE00;
        const VARIATION_SELECTOR_END = 0xFE0F;
        const VARIATION_SELECTOR_SUPPLEMENT_START = 0xE0100;
        const VARIATION_SELECTOR_SUPPLEMENT_END = 0xE01EF;
        const MARKER_PHOTO = "💌";
        const MARKER_MESSAGE = "💝";

        function toVariationSelector(byte) {
            if (byte >= 0 && byte < 16) {
                return String.fromCodePoint(VARIATION_SELECTOR_START + byte);
            } else if (byte >= 16 && byte < 256) {
                return String.fromCodePoint(VARIATION_SELECTOR_SUPPLEMENT_START + byte - 16);
            }
            return "";
        }

        function fromVariationSelector(codePoint) {
            if (codePoint >= VARIATION_SELECTOR_START && codePoint <= VARIATION_SELECTOR_END) {
                return codePoint - VARIATION_SELECTOR_START;
            } else if (codePoint >= VARIATION_SELECTOR_SUPPLEMENT_START && codePoint <= VARIATION_SELECTOR_SUPPLEMENT_END) {
                return codePoint - VARIATION_SELECTOR_SUPPLEMENT_START + 16;
            }
            return null;
        }

        function encodeMessage(secret, marker) {
            const bytes = new TextEncoder().encode(secret);
            let encoded = marker;
            for (const byte of bytes) {
                encoded += toVariationSelector(byte);
            }
            return encoded;
        }

        function decodeMessage(text) {
            const chars = Array.from(text);
            const decodedBytes = [];
            for (const ch of chars) {
                const codePoint = ch.codePointAt(0);
                const byte = fromVariationSelector(codePoint);
                if (byte !== null) decodedBytes.push(byte);
            }
            if (decodedBytes.length === 0) return null;
            return new TextDecoder().decode(new Uint8Array(decodedBytes));
        }

        function getImageUrls() {
            const urls = [];
            for (let i = 1; i <= 5; i++) {
                const val = document.getElementById(`input-photo${i}`).value.trim();
                urls.push(val || `./assets/img/p${i}.jpg`);
            }
            return urls;
        }

        function getMessageData() {
            return {
                foruser: document.getElementById('input-foruser').value.trim() || "Someone Special",
                message: document.getElementById('input-message').value.trim() || "Happy Valentine's Day! ❤️",
                sendfrom: document.getElementById('input-sendfrom').value.trim() || "Secret Admirer"
            };
        }

        function showAlertPhotos() {
            const urls = getImageUrls();
            const jsonData = JSON.stringify({
                type: "photos",
                images: urls
            });
            const encodedEmoji = encodeMessage(jsonData, MARKER_PHOTO);

            Swal.fire({
                title: "foto sudah dibuatkan",
                html: `
                    <div style="margin-bottom: 1rem;">kirim kan ke cwkmu :)</div>
                    <div class="emoji-display" id="emojiResult" style="font-size: 5rem; cursor: pointer;" title="Klik untuk copy">${encodedEmoji}</div>
                    <div style="font-size: 0.8rem; color: #666; margin-top: 0.5rem;">Klik emoji untuk copy</div>
                `,
                icon: "info",
                showClass: {
                    popup: `animate__animated animate__fadeInUp animate__faster`
                },
                hideClass: {
                    popup: `animate__animated animate__fadeOutDown animate__faster`
                },
                confirmButtonText: "Copy & Tutup",
                showCancelButton: true,
                cancelButtonText: "Tutup Saja"
            }).then((result) => {
                if (result.isConfirmed) {
                    copyToClipboard(encodedEmoji);
                }
            });

            setTimeout(() => {
                const emojiEl = document.getElementById('emojiResult');
                if (emojiEl) {
                    emojiEl.addEventListener('click', () => copyToClipboard(encodedEmoji));
                }
            }, 100);
        }

        function showAlertMessage() {
            const data = getMessageData();
            const jsonData = JSON.stringify({
                type: "message",
                ...data
            });
            const encodedEmoji = encodeMessage(jsonData, MARKER_MESSAGE);

            Swal.fire({
                title: "pesan sudah dibuatkan",
                html: `
                    <div style="margin-bottom: 1rem;">kirim kan ke cwkmu :)</div>
                    <div class="emoji-display" id="emojiResult" style="font-size: 5rem; cursor: pointer;" title="Klik untuk copy">${encodedEmoji}</div>
                    <div style="font-size: 0.8rem; color: #666; margin-top: 0.5rem;">Klik emoji untuk copy</div>
                `,
                icon: "info",
                showClass: {
                    popup: `animate__animated animate__fadeInUp animate__faster`
                },
                hideClass: {
                    popup: `animate__animated animate__fadeOutDown animate__faster`
                },
                confirmButtonText: "Copy & Tutup",
                showCancelButton: true,
                cancelButtonText: "Tutup Saja"
            }).then((result) => {
                if (result.isConfirmed) {
                    copyToClipboard(encodedEmoji);
                }
            });

            setTimeout(() => {
                const emojiEl = document.getElementById('emojiResult');
                if (emojiEl) {
                    emojiEl.addEventListener('click', () => copyToClipboard(encodedEmoji));
                }
            }, 100);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({
                    title: "Tercopy!",
                    text: "Emoji sudah di copy ke clipboard",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                Swal.fire({
                    title: "Tercopy!",
                    text: "Emoji sudah di copy ke clipboard",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });
            });
        }

        function showMail() {
            const emojiInput = document.getElementById('InputEmoji').value.trim();
            if (!emojiInput) {
                Swal.fire({
                    title: "Error",
                    text: "Masukin emoji dulu bos!",
                    icon: "error"
                });
                return;
            }

            const decoded = decodeMessage(emojiInput);
            if (!decoded) {
                Swal.fire({
                    title: "Error",
                    text: "Emoji tidak valid atau corrupted",
                    icon: "error"
                });
                return;
            }

            try {
                const data = JSON.parse(decoded);
                if (data.type !== "photos") {
                    Swal.fire({
                        title: "Error",
                        text: "Ini bukan emoji foto! Gunakan 'buka mail pesan'",
                        icon: "warning"
                    });
                    return;
                }
                const base64Data = btoa(unescape(encodeURIComponent(decoded)));
                window.location.href = `mailviewer.html#${base64Data}`;
            } catch (e) {
                Swal.fire({
                    title: "Error",
                    text: "Data tidak valid",
                    icon: "error"
                });
            }
        }

    <!--TIMER COUNTDOWN-->
    <script>
        (function() {
            const CONFIG_URL = '/libraries/timer.json'; // path to your JSON file

            fetch(CONFIG_URL)
                .then(res => res.json())
                .then(config => {
                    // ====== SETTINGS FROM JSON ======
                    const TARGET_DATE_TIME = config.targetDateTime;
                    const PASSCODE = config.passcode;
                    // =================================

                    // Check for early access permission or expired countdown
                    if (
                        localStorage.getItem('countdown_early_access') === 'granted' ||
                        new Date() >= new Date(TARGET_DATE_TIME)
                    ) return;

                    // Create overlay elements
                    const overlay = document.createElement('div');
                    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 2147483647;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      `;

                    const countdownEl = document.createElement('div');
                    countdownEl.style.cssText = `
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 300;
        letter-spacing: -0.05em;
        cursor: default;
        user-select: none;
        max-width: 100%;
        line-height: 1.2;
      `;
                    countdownEl.textContent = '00:00:00';

                    overlay.appendChild(countdownEl);
                    document.body.appendChild(overlay);

                    // Triple-click handler for passcode prompt
                    let clickCount = 0;
                    let clickTimer = null;

                    countdownEl.addEventListener('click', () => {
                        clickCount++;

                        if (clickCount === 3) {
                            const userInput = prompt('Enter early access passcode:');
                            if (userInput === PASSCODE) {
                                localStorage.setItem('countdown_early_access', 'granted');
                                overlay.remove();
                                if (window.countdownInterval) clearInterval(window.countdownInterval);
                            }
                            clickCount = 0;
                            if (clickTimer) clearTimeout(clickTimer);
                        } else {
                            if (clickTimer) clearTimeout(clickTimer);
                            clickTimer = setTimeout(() => {
                                clickCount = 0;
                            }, 300);
                        }
                    });

                    // Countdown logic
                    const updateCountdown = () => {
                        const now = Date.now();
                        const distance = new Date(TARGET_DATE_TIME).getTime() - now;

                        if (distance <= 0) {
                            overlay.style.visibility = 'hidden';
                            localStorage.removeItem('countdown_early_access');
                            window.location.reload();
                            return;
                        }

                        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                        if (days > 0) {
                            countdownEl.textContent =
                                `${days}d ${hours.toString().padStart(2, '0')}:` +
                                `${minutes.toString().padStart(2, '0')}:` +
                                `${seconds.toString().padStart(2, '0')}`;
                        } else if (hours > 0) {
                            countdownEl.textContent =
                                `${hours}h ${minutes.toString().padStart(2, '0')}:` +
                                `${seconds.toString().padStart(2, '0')}`;
                        } else {
                            countdownEl.textContent =
                                `${minutes}m ${seconds.toString().padStart(2, '0')}s`;
                        }
                    };

                    updateCountdown();
                    window.countdownInterval = setInterval(updateCountdown, 1000);
                })
                .catch(err => {
                    console.error('Failed to load countdown config:', err);
                });
        })();
    </script>
