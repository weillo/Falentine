			.photo-error {

				padding: 2rem;
				border-radius: 10px;

			}
		</style>
	<base target="_blank">
</head>
	<body>
		<div class="loading-overlay" id="loadingOverlay">
			<div class="loading-spinner"></div>

 --sealFade: 0;
 --title: 0;
 --p1: 0; --p2: 0; --p3: 0; --p4: 0; --p5: 0;">
								<!-- BACK -->

								<!-- SHAFT -->
								<div class="letter">
									<div class="photos" id="photosContainer">
										<img class="photo" id="photo1" src="./assets/img/p1.png" alt="">
										<img class="photo" id="photo2" src="./assets/img/p2.png" alt="">
										<img class="photo" id="photo3" src="./assets/img/p3.png" alt="">
										<img class="photo" id="photo4" src="./assets/img/p4.png" alt="">
										<img class="photo" id="photo5" src="./assets/img/main-pic.jpg" alt="">
									</div>

			<footer data-anim-footer="" class="footer">
				<div class="footer__container"></div>
			</footer>
		</div>

<script>
// ===========================
// Mail Viewer Decoder
// ===========================

const VARIATION_SELECTOR_START = 0xFE00;
const VARIATION_SELECTOR_END = 0xFE0F;
const VARIATION_SELECTOR_SUPPLEMENT_START = 0xE0100;
const VARIATION_SELECTOR_SUPPLEMENT_END = 0xE01EF;

function fromVariationSelector(codePoint) {
  if (codePoint >= VARIATION_SELECTOR_START && codePoint <= VARIATION_SELECTOR_END) {
    return codePoint - VARIATION_SELECTOR_START;
  } else if (codePoint >= VARIATION_SELECTOR_SUPPLEMENT_START && codePoint <= VARIATION_SELECTOR_SUPPLEMENT_END) {
    return codePoint - VARIATION_SELECTOR_SUPPLEMENT_START + 16;
  }
  return null;
}

function decodeMessage(text) {
  const chars = Array.from(text);
  const decodedBytes = [];
  for (const ch of chars) {
    const codePoint = ch.codePointAt(0);
    const byte = fromVariationSelector(codePoint);
    if (byte !== null) decodedBytes.push(byte);
  }
  if (decodedBytes.length === 0) return null;
  return new TextDecoder().decode(new Uint8Array(decodedBytes));
}

function initMailViewer() {
  const hash = window.location.hash;
  const loadingOverlay = document.getElementById('loadingOverlay');

  // Check if we have data in hash (base64 encoded)
  if (hash && hash.length > 1) {
    try {
      const base64Data = hash.substring(1);
      const jsonStr = decodeURIComponent(escape(atob(base64Data)));
      const data = JSON.parse(jsonStr);

      if (data.images && Array.isArray(data.images)) {
        // Update photos with decoded URLs
        data.images.forEach((url, index) => {
          const photoEl = document.getElementById(`photo${index + 1}`);
          if (photoEl && url) {
            // Create new image to test loading
            const testImg = new Image();
            testImg.onload = function() {
              photoEl.src = url;
            };
            testImg.onerror = function() {
              console.warn(`Failed to load image ${index + 1}: ${url}`);
              // Keep default or show error state
              photoEl.classList.add('photo-error');
              photoEl.alt = 'Image failed to load';
            };
            testImg.src = url;
          }
        });
      }

      // Hide loading after processing
      setTimeout(() => {
        loadingOverlay.style.display = 'none';
      }, 500);

    } catch (e) {
      console.error('Failed to decode:', e);
      loadingOverlay.innerHTML = `
        <div class="error-message">
          <h3>❌ Gagal Membuka Surat</h3>
          <p>Data tidak valid atau corrupted</p>
          <button onclick="window.location.href='index.html'" style="margin-top: 1rem; padding: 0.5rem 1rem; border: none; background: white; color: #ff6b6b; border-radius: 5px; cursor: pointer;">
            Kembali
          </button>
        </div>
      `;
    }
  } else {
    // No hash data, use defaults
    loadingOverlay.style.display = 'none';
  }
}

// Also check for emoji in URL path (alternative method)
function checkPathEmoji() {
  const path = window.location.pathname;
  const match = path.match(/mailviewer\.html\/(.+)/);
  if (match) {
    const emojiData = decodeURIComponent(match[1]);
    const decoded = decodeMessage(emojiData);
    if (decoded) {
      try {
        const data = JSON.parse(decoded);
        if (data.images) {
          data.images.forEach((url, index) => {
            const photoEl = document.getElementById(`photo${index + 1}`);
            if (photoEl && url) photoEl.src = url;
          });
        }
      } catch (e) {
        console.error('Path decode error:', e);
      }
    }
  }
}

// Initialize on load
document.addEventListener('DOMContentLoaded', () => {
  initMailViewer();
  checkPathEmoji();
});
</script>
	</body>
</html>
